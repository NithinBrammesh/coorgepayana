<!doctype html>
<html lang="en">
  <head>
    <!-- BASIC -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- TITLE -->
    <title>
      Coorg Payana | Premium Cab Service Across Karnataka
    </title>

    <!-- SEO DESCRIPTION -->
    <meta
      name="description"
      content="Coorg Payana offers premium cab services across Karnataka including Coorg, Mysuru, Chikmagalur and Bengaluru. Enjoy comfortable rides, professional drivers, clean vehicles and scenic travel experiences."
    />

    <!-- SEO KEYWORDS -->
    <meta
      name="keywords"
      content="Coorg cab service, Mysore to Coorg taxi, Bangalore to Coorg cab, Chikmagalur tour package, Karnataka cab service, Coorg taxi booking, hill station cab service, travel Karnataka"
    />

    <!-- AUTHOR -->
    <meta name="author" content="Coorg Payana" />

    <!-- ROBOTS -->
    <meta name="robots" content="index, follow" />

    <!-- FAVICON -->
    <link
      rel="icon"
      type="image/png"
      href="/images/logoimage.png"
    />

    <!-- GOOGLE FONTS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- OPEN GRAPH / SOCIAL MEDIA -->
    <meta
      property="og:title"
      content="Coorg Payana | Premium Cab Service Across Karnataka"
    />

    <meta
      property="og:description"
      content="Travel comfortably across Coorg, Mysuru, Chikmagalur and Karnataka with premium cab services and experienced drivers."
    />

    <meta
      property="og:image"
      content="https://coorgpayana.com/images/banner4.jpg"
    />

    <meta
      property="og:url"
      content="https://coorgpayana.com"
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- TWITTER SEO -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Coorg Payana"
    />

    <meta
      name="twitter:description"
      content="Premium cab journeys across Karnataka including Coorg, Mysuru and Chikmagalur."
    />

    <meta
      name="twitter:image"
      content="https://coorgpayana.com/images/banner4.jpg"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "name": "Coorg Payana",
        "url": "https://coorgpayana.com",
        "logo": "https://coorgpayana.com/images/logoimage.png",
        "telephone": "+918088674166",
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Karnataka",
          "addressCountry": "India"
        }
      }
    </script>

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
